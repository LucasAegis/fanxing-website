<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020202">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>繁星不语 | 绝对静默</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* ==================== 0. 全局设置 ==================== */
        :root {
            --bg-color: #020202;
            --cage-color: rgba(255, 255, 255, 0.1);
            --cage-flash: rgba(0, 255, 65, 0.5);
            --core-green: #00FF41;
            --font-mono: 'JetBrains Mono', monospace, 'Microsoft YaHei';
            --font-sans: 'Inter', sans-serif, 'Microsoft YaHei';
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #0a0a0a 0%, #000 85%);
            font-family: var(--font-mono);
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* ==================== 1. 顶部导航栏 ==================== */
        header {
            flex: 0 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 48px; 
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .logo { 
            font-family: var(--font-mono); font-weight: 800; font-size: 1.2rem; 
            letter-spacing: -1px; color: #ffffff; text-transform: uppercase; 
            text-decoration: none; cursor: pointer; transition: opacity 0.3s;
        }
        .logo:hover { opacity: 0.8; }

        nav ul { display: flex; list-style: none; gap: 32px; margin: 0; padding: 0; align-items: center; }
        nav a { text-decoration: none; color: #555; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; transition: all 0.3s; }
        nav a:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }

        /* ==================== 2. 主体区域 ==================== */
        main {
            flex: 1 1 auto;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        .stage-container {
            position: relative;
            width: 60vh; height: 60vh;
            max-width: 600px; max-height: 600px;
            display: flex; justify-content: center; align-items: center;
        }

        .cage-ring { 
            position: absolute; width: 100%; height: 100%; 
            border: 1px solid var(--cage-color); border-radius: 50%; 
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.01); z-index: 10;
            animation: breathe 8s infinite ease-in-out;
        }
        @keyframes breathe { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.4; } }
        .cage-ring.impact { animation: shieldFlash 0.15s ease-out; opacity: 1; }
        @keyframes shieldFlash { 0% { border-color: #fff; box-shadow: 0 0 60px var(--cage-flash); } 100% { border-color: var(--cage-color); box-shadow: 0 0 30px rgba(0, 255, 65, 0.01); } }

        .title-text { 
            position: absolute; top: 20%; width: 100%; text-align: center; 
            color: #fff; font-size: 1.8rem; font-weight: 800; letter-spacing: 8px; 
            text-shadow: 0 0 20px rgba(255,255,255,0.1); pointer-events: none; z-index: 15; 
        }

        .mic-group { 
            position: absolute; z-index: 20; transform: translateY(90px); 
            display: flex; flex-direction: column; align-items: center; gap: 12px; 
        }
        .mic-svg { width: 42px; height: 42px; fill: none; stroke: var(--core-green); stroke-width: 1.5; filter: drop-shadow(0 0 15px rgba(0, 255, 65, 0.4)); }
        
        .visualizer { display: flex; align-items: flex-end; gap: 4px; height: 16px; }
        .v-bar { width: 2px; background-color: var(--core-green); opacity: 0.8; animation: soundJump 0.8s ease-in-out infinite alternate; }
        .v-bar:nth-child(1) { height: 8px; animation-delay: 0.1s; } .v-bar:nth-child(2) { height: 14px; animation-delay: 0.3s; } .v-bar:nth-child(3) { height: 10px; animation-delay: 0.5s; } .v-bar:nth-child(4) { height: 14px; animation-delay: 0.2s; } .v-bar:nth-child(5) { height: 8px; animation-delay: 0.4s; }
        @keyframes soundJump { 0% { height: 4px; opacity: 0.3; } 100% { height: 16px; opacity: 1; } }

        .status-text { 
            position: absolute; top: 48%; transform: translateY(-50%); width: 100%; text-align: center; 
            color: var(--core-green); font-size: 0.95rem; letter-spacing: 4px; 
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.6); opacity: 0; z-index: 25; font-weight: 700;
        }
        .text-visible { animation: textFadeIn 2s forwards; }
        @keyframes textFadeIn { 0% { opacity: 0; transform: translateY(-40%); } 20% { opacity: 1; transform: translateY(-50%); } 80% { opacity: 1; } 100% { opacity: 0; } }

        .wave-out { position: absolute; border-radius: 50%; pointer-events: none; width: 50px; height: 50px; border: 1px solid rgba(255, 255, 255, 0.4); opacity: 0; }
        .wave-in { position: absolute; border-radius: 50%; pointer-events: none; width: 100%; height: 100%; border: 2px solid var(--core-green); opacity: 0; }
        .anim-out { animation: expandWave 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .anim-in { animation: contractWave 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        @keyframes expandWave { 0% { transform: scale(0.1); opacity: 0.6; border-width: 2px; } 90% { transform: scale(1); opacity: 1; border-width: 1px; } 100% { transform: scale(1.02); opacity: 0; } }
        @keyframes contractWave { 0% { transform: scale(1); opacity: 0.8; border-width: 1px; } 100% { transform: scale(0.1); opacity: 0; border-width: 4px; } }

        /* ==================== 3. 底部区域 ==================== */
        .footer-section {
            flex: 0 0 auto;
            display: flex; flex-direction: column; align-items: center;
            padding-top: 0px; 
            padding-bottom: 20px;
            z-index: 50;
        }

        .btn-download {
            background: rgba(255,255,255,0.02);
            color: #eee; border: 1px solid rgba(255,255,255,0.15);
            padding: 12px 36px;
            font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600;
            text-decoration: none; letter-spacing: 3px; transition: all 0.3s; 
            backdrop-filter: blur(5px);
            margin-bottom: 8px;
        }
        .btn-download:hover { 
            border-color: var(--core-green); color: var(--core-green); 
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.15); background: rgba(0, 255, 65, 0.05); 
        }

        .stenographer-text {
            font-family: var(--font-mono); 
            color: #fff; 
            font-size: 0.9rem;
            font-weight: 800; 
            letter-spacing: 2px; 
            text-align: center; 
            opacity: 0.9;
        }

        .language-alert {
            display: flex; align-items: center; gap: 6px;
            color: var(--core-green);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.4);
            margin-top: 12px;    
            margin-bottom: 12px; 
        }
        .lang-icon { width: 14px; height: 14px; fill: var(--core-green); }

        .features-row { 
            display: flex; gap: 30px; 
            margin-bottom: 15px; 
        }
        .feat-item { 
            display: flex; align-items: center; gap: 8px; 
            color: #555; 
            font-size: 0.75rem; 
            letter-spacing: 1px; font-weight: 600;
        }
        .feat-icon { width: 14px; height: 14px; stroke: var(--core-green); stroke-width: 1.5; fill: none; opacity: 0.8; }

        .footer-text-group {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 6px; 
        }

        .footer-line {
            font-family: var(--font-sans); 
            color: #666; 
            font-size: 0.7rem; 
            font-weight: 700; 
            text-align: center; 
            letter-spacing: 1px;
            opacity: 0.8;
            margin: 0; padding: 0;
        }
        
        .hardware-box {
            border: 1px solid #333; 
            padding: 4px 10px;
            color: #555; 
            display: inline-block;
            margin-top: 4px; 
        }

        /* ==================== 移动端适配 ==================== */
        @media (max-width: 900px) {
            header { 
                padding: 15px 15px; 
                flex-direction: column; 
                gap: 15px; 
                align-items: center; 
            }
            nav { width: 100%; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; display: flex; justify-content: center; }
            nav ul { display: flex; gap: 20px; width: max-content; padding: 0 10px; margin: 0; align-items: center; }
            nav a { font-size: 0.8rem; font-weight: 600; white-space: nowrap; color: #999; }
            nav a.active, nav a:hover { color: #fff; }

            .stage-container { 
                width: 70vw; height: 70vw; 
                max-width: 320px; max-height: 320px;
            }
            .title-text { font-size: 1.4rem; top: 18%; }
            .mic-group { transform: translateY(50px); }
            
            .features-row { gap: 12px; width: 100%; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
            .feat-item { font-size: 0.65rem; }
            
            .footer-text-group { gap: 4px; }
            .footer-line { font-size: 0.6rem; padding: 0 10px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">繁星不语</a>
        <nav>
            <ul>
                <li><a href="privacy.html">隐私声明</a></li>
                <li><a href="contact.html">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="stage-container">
            <div class="title-text">绝对<br>静默</div>
            <div class="status-text" id="statusText">等待输入...</div>
            
            <div class="mic-group">
                <svg class="mic-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                <div class="visualizer">
                    <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
                </div>
            </div>

            <div class="cage-ring" id="cage"></div>
            <div class="wave-out" id="waveOut"></div>
            <div class="wave-in" id="waveIn"></div>
        </div>
    </main>

    <div class="footer-section">
        <a href="#" class="btn-download">[ 敬请期待 ]</a>

        <div class="stenographer-text">
            您的离线数字助理
        </div>

        <div class="language-alert">
            <svg class="lang-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            运行环境：纯血鸿蒙专属
        </div>

        <div class="features-row">
            <div class="feat-item"><svg class="feat-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg> 物理断网</div>
            <div class="feat-item"><svg class="feat-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2m0 2a8 8 0 0 0-8 8c0 4.418 3.582 8 8 8s8-3.582 8-8-3.582-8-8-8"/></svg> 端侧处理</div>
            <div class="feat-item"><svg class="feat-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> 军工级隐私</div>
        </div>

        <div class="footer-text-group">
            <div class="footer-line">
                专为极致隐私打造的纯单机应用
            </div>
            <div class="footer-line">
                无云端。无日志。数据绝对留存本地
            </div>
            <div class="footer-line hardware-box">
                ⚠️ 纯正单机架构，绝无云端后门
            </div>
        </div>
    </div>

    <script>
        const cage = document.getElementById('cage');
        const waveOut = document.getElementById('waveOut');
        const waveIn = document.getElementById('waveIn');
        const statusText = document.getElementById('statusText');
        // 将原有的动画播报文字汉化，更符合单机隐私主题
        const messages = ["检测到环境数据", "云端端口：已物理阻断", "隐私上传：拦截成功", "数据处理：纯本地运行"];
        let isAnimating = false;
        function runSequence() {
            if (isAnimating) return; isAnimating = true;
            waveOut.classList.remove('anim-out'); void waveOut.offsetWidth; waveOut.classList.add('anim-out'); updateText(messages[0]);
            setTimeout(() => { cage.classList.add('impact'); setTimeout(() => cage.classList.remove('impact'), 200); updateText(messages[1]); }, 1200);
            setTimeout(() => { waveIn.classList.remove('anim-in'); void waveIn.offsetWidth; waveIn.classList.add('anim-in'); }, 1400);
            setTimeout(() => { updateText(messages[3]); isAnimating = false; }, 2200);
        }
        function updateText(msg) { statusText.textContent = msg; statusText.classList.remove('text-visible'); void statusText.offsetWidth; statusText.classList.add('text-visible'); }
        setInterval(runSequence, 4500); document.querySelector('.stage-container').addEventListener('click', runSequence); setTimeout(runSequence, 800);
    </script>
</body>
</html>
