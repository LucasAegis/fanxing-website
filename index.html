<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>繁星不语 | 守护你的声音</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <link rel="stylesheet" href="home/style.css">

    <style>
        /* ==================== 全局基础设置与导航栏 (留在 index.html) ==================== */
        :root {
            --bg-color: #f8fafc; 
            --text-main: #1e293b;
            --text-muted: #64748b;
            --brand-purple: #8A2BE2;
            --font-family: 'Inter', 'Noto Sans SC', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100%;
            background-color: var(--bg-color);
            font-family: var(--font-family);
            color: var(--text-main);
            scroll-behavior: smooth;
        }

        /* 悬浮导航栏 */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 72px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 50px; box-sizing: border-box;
            background: rgba(248, 250, 252, 0.3); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .logo-text {
            font-size: 1.4rem; font-weight: 800; color: var(--brand-purple);
            letter-spacing: 2px; text-decoration: none;
        }

        nav ul { display: flex; list-style: none; gap: 30px; margin: 0; padding: 0; }
        nav li a {
            text-decoration: none; color: var(--text-muted);
            font-weight: 600; font-size: 0.95rem; transition: color 0.3s;
        }
        nav li a:hover, nav li a.active { color: var(--brand-purple); }

        @media (max-width: 900px) { header { padding: 0 20px; } }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-text">繁星不语</a>
        <nav>
            <ul>
                <li><a href="#" class="active">首页</a></li>
                <li><a href="privacy.html">隐私声明</a></li>
                <li><a href="contact.html">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <div id="canvas-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 80vh; min-height: 600px; z-index: 1;"></div>
    
    <div id="home-dynamic-content" style="position: relative; z-index: 2;"></div>

    <script src="home/content.js"></script>
    <script src="home/orbit.js"></script>

</body>
</html>
