<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020202">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>联系我们 | 繁星不语</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* ==================== 全局设置 ==================== */
        :root {
            --bg-color: #020202;
            --core-green: #00FF41;
            --text-grey: #888;
            --font-mono: 'JetBrains Mono', monospace, 'Microsoft YaHei';
        }

        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100%;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #0a0a0a 0%, #000 85%);
            font-family: var(--font-mono); color: #ccc;
            display: flex; flex-direction: column;
        }

        /* ==================== 1. 顶部导航栏 (与主页一致) ==================== */
        header {
            flex: 0 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 48px; 
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .logo { 
            font-family: var(--font-mono); font-weight: 800; font-size: 1.2rem; 
            letter-spacing: -1px; color: #ffffff; text-transform: uppercase; 
            text-decoration: none; cursor: pointer; transition: opacity 0.3s;
        }
        .logo:hover { opacity: 0.8; }

        nav ul { display: flex; list-style: none; gap: 32px; margin: 0; padding: 0; align-items: center; }
        nav a { text-decoration: none; color: #555; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; transition: all 0.3s; }
        nav a:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        nav a.active { color: var(--core-green); text-shadow: 0 0 8px rgba(0, 255, 65, 0.4); }

        /* ==================== 2. 主体内容 ==================== */
        main {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 60px 20px; max-width: 900px; margin: 0 auto; width: 100%;
            box-sizing: border-box;
        }

        .channel-status { color: var(--core-green); font-size: 0.9rem; letter-spacing: 2px; margin-bottom: 20px; animation: blink 2s infinite; font-weight: 700; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .contact-intro { text-align: center; width: 100%; margin-bottom: 50px; line-height: 1.8; font-size: 0.95rem; }

        /* 邮箱盒子 */
        .email-box { border: 1px solid #333; padding: 30px 50px; text-align: center; margin-bottom: 40px; transition: all 0.3s; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); }
        .email-box:hover { border-color: #555; box-shadow: 0 0 20px rgba(255,255,255,0.05); }
        .email-label { font-size: 0.8rem; color: #777; margin-bottom: 15px; letter-spacing: 2px; font-weight: 700; }
        .email-link { color: #fff; text-decoration: none; font-size: 1.4rem; letter-spacing: 1px; border-bottom: 1px dashed #666; padding-bottom: 4px; transition: all 0.3s; font-weight: 600; }
        .email-link:hover { color: var(--core-green); border-color: var(--core-green); text-shadow: 0 0 10px rgba(0, 255, 65, 0.3); }

        /* ==================== 移动端专属适配 ==================== */
        @media (max-width: 900px) {
            header { 
                padding: 15px 15px; 
                flex-direction: column; 
                gap: 15px; 
                align-items: center; 
            }
            
            nav { width: 100%; overflow-x: auto; padding-bottom: 5px; -webkit-overflow-scrolling: touch; display: flex; justify-content: center; }
            nav ul { 
                display: flex; 
                gap: 20px; 
                width: max-content; 
                padding: 0 10px; 
                margin: 0; 
            }
            nav a { font-size: 0.8rem; font-weight: 600; white-space: nowrap; color: #999; }

            main { padding: 30px 20px; justify-content: flex-start; margin-top: 10vh; }
            .email-box { padding: 25px 20px; width: 90%; max-width: 320px; }
            .email-link { font-size: 1.1rem; } 
            .contact-intro { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">繁星不语</a>
        <nav>
            <ul>
                <li><a href="privacy.html">隐私声明</a></li>
                <li><a href="contact.html" class="active">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="channel-status">安全加密通道已建立</div>
        
        <div class="contact-intro">
            如有任何企业合作、功能定制或技术问题反馈，请随时与我们联系。<br>
            <span style="font-size: 0.75rem; color: #666; display: inline-block; margin-top: 8px;">系统响应时间：通常在 24 小时内。</span>
        </div>

        <div class="email-box">
            <div class="email-label">核心对接邮箱</div>
            <a href="mailto:lucas@fanxingos.com" class="email-link">lucas@fanxingos.com</a>
        </div>
    </main>
</body>
</html>
